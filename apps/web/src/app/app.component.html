@if (auth.user()) {
  <div class="app-shell">
    <aside>
      <a class="brand" routerLink="/dashboard">VAYUJIT OS</a>
      <nav aria-label="Primary navigation">
        @for (item of navigation; track item[1]) {
          <a [routerLink]="item[1]" routerLinkActive="active">{{ item[0] }}</a>
        }
      </nav>
      <div>
        <strong>{{ auth.user()?.fullName }}</strong
        ><small>Owner</small>
      </div>
      <button type="button" (click)="logout()">Log out</button>
    </aside>
    <main>
      <details class="mobile-menu">
        <summary>Application menu</summary>
        <nav aria-label="Mobile primary navigation">
          @for (item of navigation; track item[1]) {
            <a [routerLink]="item[1]" routerLinkActive="active">{{ item[0] }}</a>
          }
        </nav>
      </details>
      <header class="context-header">
        <span>Active brand</span>
        <strong>{{ brands.activeBrand()?.name || 'No active brand' }}</strong>
      </header>
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
