upstream vayujit_api { server api:8000; }
upstream vayujit_web { server web:8080; }

server {
  listen 8081;
  server_name localhost 127.0.0.1;
  client_max_body_size 12m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    proxy_pass http://vayujit_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /health/live { proxy_pass http://vayujit_api; }
  location = /health/ready { proxy_pass http://vayujit_api; }
  location / {
    proxy_pass http://vayujit_web;
    proxy_set_header Host $host;
  }
}
