services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayujit}
      POSTGRES_USER: ${POSTGRES_USER:-vayujit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayujit_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vayujit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayujit} -d ${POSTGRES_DB:-vayujit}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vayujit_postgres_data:
