name: VAYUJIT CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VAYUJIT_ENV: test
  VAYUJIT_ENVIRONMENT: test
  VAYUJIT_ALLOWED_ORIGINS: http://127.0.0.1:4200
  VAYUJIT_ALLOW_MISSING_ORIGIN: 'false'
  VAYUJIT_LIVE_AI_ENABLED: 'false'
  VAYUJIT_LIVE_SOCIAL_PUBLISHING_ENABLED: 'false'
  VAYUJIT_LIVE_MARKETPLACE_MUTATIONS_ENABLED: 'false'
  VAYUJIT_LIVE_ADS_MUTATIONS_ENABLED: 'false'
  VAYUJIT_ADS_LIVE_SPEND_ENABLED: 'false'

jobs:
  dependencies:
    name: Lockfile and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  api-unit:
    name: API unit, Ruff, Black, mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: pytest -q apps/api/tests/test_production_readiness_security.py apps/api/tests/test_media_backup_recovery.py
      - run: ruff check apps/api
      - run: black --check apps/api
      - run: mypy apps/api/vayujit_api

  web:
    name: Angular tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build --workspace @vayujit/web

  desktop:
    name: Electron tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run build --workspace @vayujit/desktop

  migration:
    name: Disposable migration cycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vayujit
          POSTGRES_PASSWORD: vayujit_dev
          POSTGRES_DB: vayujit_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vayujit -d vayujit_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "apps/api[dev]"
      - name: Create disposable marker
        env:
          PGPASSWORD: vayujit_dev
        run: |
          psql -h 127.0.0.1 -U vayujit -d vayujit_migration_test -v ON_ERROR_STOP=1 -c "CREATE TABLE test_database_marker (marker_id integer PRIMARY KEY, project_identifier text NOT NULL, created_at timestamptz NOT NULL DEFAULT now(), suite_token text NOT NULL); INSERT INTO test_database_marker(marker_id, project_identifier, suite_token) VALUES (1, 'vayujit-os-disposable-test-database-v1', 'ci-local');"
      - name: Upgrade, downgrade, upgrade
        env:
          VAYUJIT_DATABASE_URL: postgresql+psycopg://vayujit:vayujit_dev@127.0.0.1:5432/vayujit_migration_test
        working-directory: apps/api
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade -1
          alembic -c alembic.ini upgrade head
          test "$(alembic -c alembic.ini current | grep -c '(head)')" -eq 1

  certification:
    name: Bounded local certification gate
    needs: [dependencies, api-unit, web, desktop, migration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vayujit
          POSTGRES_PASSWORD: vayujit_dev
          POSTGRES_DB: vayujit_certification_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vayujit -d vayujit_certification_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e "apps/api[dev]"
      - name: Create disposable certification marker
        env:
          PGPASSWORD: vayujit_dev
        run: |
          psql -h 127.0.0.1 -U vayujit -d vayujit_certification_test -v ON_ERROR_STOP=1 -c "CREATE TABLE test_database_marker (marker_id integer PRIMARY KEY, project_identifier text NOT NULL, created_at timestamptz NOT NULL DEFAULT now(), suite_token text NOT NULL); INSERT INTO test_database_marker(marker_id, project_identifier, suite_token) VALUES (1, 'vayujit-os-disposable-test-database-v1', 'ci-certification');"
      - name: Final application certification constituents
        env:
          VAYUJIT_TEST_DATABASE_URL: postgresql+psycopg://vayujit:vayujit_dev@127.0.0.1:5432/vayujit_certification_test
        run: >-
          pytest -q -m integration
          apps/api/tests/test_final_application_certification.py
          apps/api/tests/test_final_owner_isolation.py
          apps/api/tests/test_final_version_safety.py
          apps/api/tests/test_final_product_channel.py
          apps/api/tests/test_final_calendar.py
          apps/api/tests/test_final_integrity.py
          apps/api/tests/test_media_recovery_integration.py
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:web
      - run: npm run test:desktop
      - run: npm run security:audit:prod
